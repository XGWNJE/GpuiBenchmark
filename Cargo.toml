[package]
name = "gpui-lab"
version = "0.1.0"
edition = "2021"
publish = false
description = "Android GPUI stress testing and style preview"

[lib]
name = "gpui_lab"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "13c716b687b47f96a677aaf46c8fa341fa7208da", default-features = false, features = ["component"] }
gpui = { package = "gpui-pre", version = "=0.3.6", default-features = false }
gpui-mobile = { git = "https://github.com/itsbalamurali/gpui-mobile", rev = "5fd54f4554263ae06753e90472c7f2e2ff5d7495", default-features = false }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"
jni = "0.22"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

